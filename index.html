<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Default brand: the Taiga favicon. The workersvc leaf only on the
         workers.vc deployment — this bundle is shared, so every other host
         (linkedtrust.us, localhost, …) keeps the default. DNS-safe match:
         workers.vc and *.workers.vc only. -->
    <link rel="icon" href="/favicon.ico" />
    <script>
      (function () {
        // %VITE_BRAND% is replaced by Vite at serve/build time; when unset it
        // stays a literal "%VITE_BRAND%" (or empty), which never equals a brand
        // id, so production hostname detection is unaffected. In dev it lets
        // VITE_BRAND=workersvc force the brand on localhost before first paint.
        var isWorkersVc =
          "%VITE_BRAND%" === "workersvc" || /(^|\.)workers\.vc$/.test(location.hostname);
        if (!isWorkersVc) return;
        document.documentElement.dataset.brand = "workersvc";
        var svg = document.createElement("link");
        svg.rel = "icon";
        svg.type = "image/svg+xml";
        svg.href = "/favicon.svg";
        document.head.appendChild(svg);
        var ico = document.querySelector('link[rel="icon"]:not([type])');
        if (ico) ico.href = "/favicon-workersvc.ico";
        var host = location.hostname.replace(/\..*/, "");
        document.title = host + " \u00b7 workers.vc";
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaigaLT</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
